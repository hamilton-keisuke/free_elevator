<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エレベーターたいけん</title>
<style>
  :root {
    --bg: #1d2230;
    --panel: #2b3145;
    --panel-line: #444c66;
    --text: #ffffff;
    --floor-btn: #eef1f6;
    --floor-btn-text: #222;
    --lit: #ffb030;
    --board: #2fb36b;
    --alight: #f07a2c;
    --stay: #3d8fe0;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  #view { flex: 1; position: relative; min-height: 0; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud {
    position: absolute; background: rgba(0,0,0,.6); border-radius: 999px;
    padding: 8px 16px; font-size: clamp(14px, 2.2vw, 20px); pointer-events: none;
  }
  #where { top: 12px; left: 12px; }
  #status {
    flex: 0 0 auto; background: #11141d; text-align: center; padding: 10px 16px;
    font-size: clamp(15px, 2.2vw, 20px); border-top: 3px solid var(--panel-line);
  }
  #controls {
    flex: 0 0 auto; background: var(--panel);
    padding: 14px 16px 18px; min-height: 92px; box-sizing: border-box;
    display: grid; grid-template-columns: minmax(0, auto) 1fr minmax(0, auto); gap: 14px; align-items: center;
  }
  #controls .center { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; }
  .group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .waiting { opacity: .7; font-size: 18px; }
  button.b {
    font: inherit; border: none; cursor: pointer; border-radius: 14px;
    box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .05s;
  }
  button.b:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  button.floor {
    width: 64px; height: 64px; border-radius: 50%; font-size: 20px; font-weight: bold;
    background: var(--floor-btn); color: var(--floor-btn-text);
  }
  button.call {
    width: 84px; height: 64px; font-size: 18px; font-weight: bold;
    background: var(--floor-btn); color: var(--floor-btn-text); line-height: 1.1;
  }
  button.call .arrow { font-size: 24px; display: block; }
  button.door { width: 84px; height: 64px; font-size: 16px; font-weight: bold; background: #dfe9f5; color: #223; line-height: 1.1; }
  button.door .arrow { font-size: 20px; display: block; letter-spacing: -2px; }
  button.lit { background: var(--lit); color: #fff; box-shadow: 0 0 14px var(--lit), 0 4px 0 rgba(0,0,0,.35); }
  button.action { padding: 16px 26px; font-size: 20px; font-weight: bold; color: #fff; }
  button.board { background: var(--board); }
  button.skip { background: var(--stay); }
  button.alight { background: var(--alight); }
  button.stay { background: var(--stay); }
  button.nav { padding: 14px 18px; font-size: 18px; font-weight: bold; color: #fff; background: #7a5cc7; line-height: 1.2; }
  button.stairs { width: 104px; height: 64px; font-size: 17px; font-weight: bold; background: #f4e7c8; color: #3a2a10; line-height: 1.1; }
  button.stairs .arrow { font-size: 20px; display: block; }
  @media (max-width: 600px) {
    button.floor { width: 54px; height: 54px; font-size: 17px; }
    button.action { padding: 12px 18px; font-size: 17px; }
    button.nav { padding: 10px 10px; font-size: 15px; }
    #controls { padding-left: 10px; padding-right: 10px; gap: 8px; }
  }
</style>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="where" class="hud"></div>
  </div>
  <div id="status"></div>
  <div id="controls"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ============================================================
// 設定（将来は設定画面から変更できるようにする想定）
// ============================================================
const CONFIG = {
  floors: ['B1F', '1F', '2F', '3F', '4F', '5F', 'R'], // 下から順
  playerStartFloor: '1F',
  elevatorStartFloor: '4F',
  secondsPerFloor: 1.1,
  doorSeconds: 0.9,
};
const FLOORS = CONFIG.floors;
const TOP = FLOORS.length - 1;
const FLOOR_COLORS = ['#8d8f99', '#e8dcc4', '#cfe3f0', '#d9ecd2', '#f3d9de', '#e6dff5', '#bfe6ff'];
const short = f => f.replace(/F$/, '');                 // 'B1F' -> 'B1', 'R' -> 'R'
const kana = f => f === 'R' ? 'おくじょう'
  : f.startsWith('B') ? `ちか${f.slice(1, -1)}かい` : `${f.slice(0, -1)}かい`;

// ============================================================
// 状態
// ============================================================
// phase:
//  OUT_IDLE     そと・エレベーター停止中（待ち）      押せる: そとのボタン
//  OUT_WAITING  そと・エレベーター移動中（待ち）      押せる: そとのボタン
//  OUT_CLOSING  そと・おりた後に扉が閉まる途中        押せる: そとのボタン（開け直す）
//  OUT_ARRIVED  そと・エレベーター到着（扉ひらき）    押せる: のる, のらない
//  BOARDING     のっている途中                        押せる: なし
//  IN_STOPPED   なか・停止中（扉ひらき）              押せる: 階ボタン, 閉, おりる
//  IN_ARRIVED   なか・目的階に到着（扉ひらき）        押せる: 階ボタン, 閉, おりる, おりない
//  IN_CLOSED    なか・停止中（扉しまっている）        押せる: 階ボタン, 開, おりる
//  IN_CLOSING   なか・扉が閉まる途中                  押せる: 開
//  IN_MOVING    なか・移動中                          押せる: なし
//  ALIGHTING    おりている途中                        押せる: なし
//  STAIRS_IDLE  かいだんエリアにいる                  押せる: のぼる, おりる, エレベーターのまえにいく
//  CLIMBING     かいだんを上り下りしている途中        押せる: なし
//  WALKING      ホール⇔かいだんを歩いている途中       押せる: なし
//  BUSY         扉の開閉中など                        押せる: なし
const S = {
  phase: 'OUT_IDLE',
  inside: false,
  onStairs: false, // かいだんエリアにいる
  climbDir: 0,
  playerFloor: FLOORS.indexOf(CONFIG.playerStartFloor),
  carFloor: FLOORS.indexOf(CONFIG.elevatorStartFloor),
  carPos: FLOORS.indexOf(CONFIG.elevatorStartFloor), // かごの位置（階の途中も表せる小数）
  moving: false,
  moveDir: 0,
  target: null,
  door: 0, // 0=しまっている 1=ひらいている
  callLit: { up: false, down: false },
  doorBtnLit: null, // 'open' | 'close'
};

// ============================================================
// Three.js 基本
// ============================================================
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1016);
const camera = new THREE.PerspectiveCamera(60, 1, 0.03, 50);
camera.rotation.order = 'YXZ';

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1 ? 78 : 60;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...extra });
function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  return m;
}
function plane(w, h, mat, x, y, z, rx = 0, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0);
  return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const redraw = (...a) => { ctx.clearRect(0, 0, w, h); draw(ctx, w, h, ...a); tex.needsUpdate = true; };
  return { tex, redraw };
}
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif';

// ---------- 表示器（階数インジケーター） ----------
function drawIndicator(ctx, w, h) {
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ff9a1f';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold 84px ${FONT}`;
  ctx.fillText(short(FLOORS[S.carFloor]), w * 0.6, h * 0.54);
  if (S.moving) {
    ctx.font = `bold 64px ${FONT}`;
    ctx.fillText(S.moveDir > 0 ? '▲' : '▼', w * 0.2, h * 0.54);
  }
}

// ---------- ボタン用テクスチャ ----------
function buttonTextures(label) {
  const make = lit => {
    const t = canvasTex(128, 128, ctx => {
      ctx.beginPath(); ctx.arc(64, 64, 60, 0, Math.PI * 2);
      ctx.fillStyle = lit ? '#ffb030' : '#e9ecf1'; ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = lit ? '#fff1c9' : '#9aa1ad'; ctx.stroke();
      ctx.fillStyle = lit ? '#fff' : '#333';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${label.length > 1 ? 50 : 62}px ${FONT}`;
      ctx.fillText(label, 64, 68);
    });
    t.redraw();
    return t.tex;
  };
  return { normal: make(false), lit: make(true) };
}

const clickables = [];
function makeButton(label, radius, action, zone) {
  const tx = buttonTextures(label);
  const mesh = new THREE.Mesh(new THREE.CircleGeometry(radius, 40),
    new THREE.MeshBasicMaterial({ map: tx.normal, transparent: true }));
  mesh.userData = { action, zone, tx };
  clickables.push(mesh);
  return mesh;
}
const setLit = (mesh, lit) => { mesh.material.map = lit ? mesh.userData.tx.lit : mesh.userData.tx.normal; };

// ============================================================
// ホール（エレベーターのそと）
// ============================================================
const hall = new THREE.Group(); scene.add(hall);
const hallWallMat = std(FLOOR_COLORS[1]);
const hallFloorMat = std('#7b808b');
hall.add(plane(8, 8.1, hallFloorMat, 0, 0, 3.95, -Math.PI / 2));
hall.add(plane(8, 8.1, new THREE.MeshBasicMaterial({ color: 0xdcdcdc }), 0, 3.2, 3.95, Math.PI / 2)); // 天井（照明のテカリが出ないように光の影響を受けない素材）
// 左の壁（かいだんへの入口 z 2.9..3.9・高さ2.4m があいている）
hall.add(box(0.2, 4.0, 3.0, hallWallMat, -4.1, 2.0, 1.4));
hall.add(box(0.2, 4.0, 4.1, hallWallMat, -4.1, 2.0, 5.95));
hall.add(box(0.2, 1.6, 1.0, hallWallMat, -4.1, 3.2, 3.4));
hall.add(plane(8.1, 3.2, hallWallMat, 4, 1.6, 3.95, 0, -Math.PI / 2));
hall.add(plane(8, 3.2, hallWallMat, 0, 1.6, 8, 0, Math.PI));
// 正面の壁（扉の穴: x -0.6..0.6, y 0..2.2）
hall.add(box(3.4, 3.2, 0.2, hallWallMat, -2.3, 1.6, 0));
hall.add(box(3.4, 3.2, 0.2, hallWallMat, 2.3, 1.6, 0));
hall.add(box(1.2, 1.0, 0.2, hallWallMat, 0, 2.7, 0));
// 扉枠
const trimMat = std('#9da4ae', { metalness: 0.3, roughness: 0.4 });
hall.add(box(0.08, 2.26, 0.06, trimMat, -0.64, 1.13, 0.11));
hall.add(box(0.08, 2.26, 0.06, trimMat, 0.64, 1.13, 0.11));
hall.add(box(1.36, 0.08, 0.06, trimMat, 0, 2.24, 0.11));
hall.add(box(1.2, 0.02, 0.2, trimMat, 0, 0.01, 0));
// 幅木
hall.add(box(8, 0.1, 0.02, std('#555a66'), 0, 0.05, 0.11));

// 階の看板
const floorSign = canvasTex(512, 320, (ctx, w, h) => {
  const f = FLOORS[hallFloor()];
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#334'; ctx.lineWidth = 14; ctx.strokeRect(7, 7, w - 14, h - 14);
  ctx.fillStyle = '#223';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold 170px ${FONT}`; ctx.fillText(f, w / 2, h * 0.42);
  ctx.font = `bold 56px ${FONT}`; ctx.fillText(kana(f), w / 2, h * 0.82);
});
hall.add(plane(1.2, 0.75, new THREE.MeshBasicMaterial({ map: floorSign.tex }), -2.2, 1.7, 0.11));

// そとの表示器
const outIndicator = canvasTex(256, 128, drawIndicator);
hall.add(box(0.6, 0.3, 0.03, std('#333'), 0, 2.6, 0.11));
hall.add(plane(0.52, 0.24, new THREE.MeshBasicMaterial({ map: outIndicator.tex }), 0, 2.6, 0.13));

// そとの呼びボタン
const callPlate = box(0.2, 0.36, 0.02, trimMat, 0.95, 1.15, 0.11);
hall.add(callPlate);
const upBtn = makeButton('▲', 0.055, 'call:up', 'out');
const downBtn = makeButton('▼', 0.055, 'call:down', 'out');
upBtn.position.set(0.95, 1.23, 0.125);
downBtn.position.set(0.95, 1.07, 0.125);
hall.add(upBtn, downBtn);

// 「← かいだん」の案内
const stairsGuide = canvasTex(384, 128, (ctx, w, h) => {
  ctx.fillStyle = '#1f8a4c'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold 64px ${FONT}`; ctx.fillText('← かいだん', w / 2, h / 2 + 4);
});
stairsGuide.redraw();
hall.add(plane(0.9, 0.3, new THREE.MeshBasicMaterial({ map: stairsGuide.tex }), -1.95, 2.55, 0.11));

// ============================================================
// かいだん（ホールの左にある折り返し階段）
//  ・階の床(踊り場) x -4..-5.2 → 左側(z 3.45..5.0)の階段で半階のぼる → 奥の踊り場で折り返し
//    → 右側(z 1.8..3.35)の階段で半階のぼる → 上の階の床
//  ・いまの階(level 0)と、その上下1階ぶん(level ±1)を積み重ねて作る。
//    のぼり下りの途中、奥の踊り場で「いまの階」を切り替えても見た目が変わらないようにするため。
// ============================================================
const STEPS = 10, RISE = 0.16, RUN = 0.3;           // 半階あたりの段数・1段の高さ・奥行き
const HALF = STEPS * RISE, FLOOR_H = HALF * 2;        // 半階・1階の高さ（1.6m / 3.2m）
const SX = -5.2, FAR = SX - STEPS * RUN;             // 階段の始まり・終わり（x）
const WALL_X = FAR - 1;                              // 奥の壁
const LEFT_Z = 4.225, RIGHT_Z = 2.575, FLIGHT_W = 1.55;
const stairWallMat = std('#d4d2cb', { side: THREE.DoubleSide });
const stepMat = std('#a3a6ad');
const slabMat = std('#8e9198');
const nosingMat = std('#e0b43a');
// 手すり: ステンレス風（金属の映り込み用に、手すりだけに部屋の環境マップを使う）
const metalEnv = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const railMat2 = new THREE.MeshStandardMaterial({ color: 0xd5d9df, metalness: 0.9, roughness: 0.22, envMap: metalEnv, envMapIntensity: 1.1 });
const cyl = (r, h, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), mat); m.position.set(x, y, z); return m; };
const stairs = new THREE.Group(); hall.add(stairs);

// 階段室の壁（上下に長い）
const SH_BOTTOM = -8, SH_TOP = 10, SH_H = SH_TOP - SH_BOTTOM, SH_MID = (SH_TOP + SH_BOTTOM) / 2;
stairs.add(plane(-4 - WALL_X, SH_H, stairWallMat, (-4 + WALL_X) / 2, SH_MID, 1.8));               // 右の壁
stairs.add(plane(-4 - WALL_X, SH_H, stairWallMat, (-4 + WALL_X) / 2, SH_MID, 5.0, 0, Math.PI));   // 左の壁
stairs.add(plane(3.2, SH_H, stairWallMat, WALL_X, SH_MID, 3.4, 0, Math.PI / 2));                  // 奥の壁
// 手前（ホール側）の壁の裏。いまの階の入口（z 2.9..3.9, y 0..2.4）はあけておく
const OPEN_Z0 = 2.9, OPEN_Z1 = 3.9, OPEN_H = 2.4;
stairs.add(plane(3.2, -SH_BOTTOM, stairWallMat, -4.22, SH_BOTTOM / 2, 3.4, 0, -Math.PI / 2));
stairs.add(plane(3.2, SH_TOP - OPEN_H, stairWallMat, -4.22, (SH_TOP + OPEN_H) / 2, 3.4, 0, -Math.PI / 2));
stairs.add(plane(OPEN_Z0 - 1.8, OPEN_H, stairWallMat, -4.22, OPEN_H / 2, (1.8 + OPEN_Z0) / 2, 0, -Math.PI / 2));
stairs.add(plane(5.0 - OPEN_Z1, OPEN_H, stairWallMat, -4.22, OPEN_H / 2, (OPEN_Z1 + 5.0) / 2, 0, -Math.PI / 2));
// 入口の枠（x の位置を変えて、ホール側・かいだん側の両方に付ける）
function doorFrame(x, y0) {
  const g = new THREE.Group();
  g.add(box(0.06, OPEN_H + 0.06, 0.08, trimMat, x, y0 + (OPEN_H + 0.06) / 2, OPEN_Z0 - 0.04));
  g.add(box(0.06, OPEN_H + 0.06, 0.08, trimMat, x, y0 + (OPEN_H + 0.06) / 2, OPEN_Z1 + 0.04));
  g.add(box(0.06, 0.08, OPEN_Z1 - OPEN_Z0 + 0.16, trimMat, x, y0 + OPEN_H + 0.04, 3.4));
  return g;
}
hall.add(doorFrame(-3.98, 0));
stairs.add(plane(-4 - WALL_X, 3.2, std('#55585e'), (-4 + WALL_X) / 2, SH_BOTTOM, 3.4, -Math.PI / 2));

// 階ごとの部品（level = いまの階からの差 -1, 0, +1）
const slope = (len, rise) => ({ len: Math.hypot(len, rise), ang: Math.atan2(rise, len) });
function makeLevel(k) {
  const y0 = k * FLOOR_H;
  const L = { k, all: new THREE.Group(), up: new THREE.Group(), down: new THREE.Group() };
  // 階の床（踊り場）
  L.all.add(box(-4.0 - SX, 0.35, 3.2, slabMat, (SX - 4.0) / 2, y0 - 0.175, 3.4));
  // のぼり（左）: y0 → y0+HALF、奥の踊り場まで
  for (let i = 0; i < STEPS; i++) {
    const top = y0 + (i + 1) * RISE, x = SX - RUN * (i + 0.5);
    L.up.add(box(RUN, 0.35, FLIGHT_W, stepMat, x, top - 0.175, LEFT_Z));
    L.up.add(box(0.04, 0.012, FLIGHT_W, nosingMat, SX - RUN * i - 0.02, top + 0.006, LEFT_Z));
  }
  L.up.add(box(1, 0.35, 3.2, slabMat, FAR - 0.5, y0 + HALF - 0.175, 3.4));   // 奥の踊り場
  // くだり（右）: y0 → y0-HALF（下の階から来る階段の上半分）
  for (let i = 0; i < STEPS; i++) {
    const top = y0 - (i + 1) * RISE, x = SX - RUN * (i + 0.5);
    L.down.add(box(RUN, 0.35, FLIGHT_W, stepMat, x, top - 0.175, RIGHT_Z));
    L.down.add(box(0.04, 0.012, FLIGHT_W, nosingMat, SX - RUN * (i + 1) + 0.02, top + 0.006, RIGHT_Z));
  }
  L.down.add(box(0.04, 0.012, FLIGHT_W, nosingMat, SX + 0.02, y0 + 0.006, RIGHT_Z)); // 床の先端
  // 手すり（まんなか）
  const sl = slope(SX - FAR, HALF);
  const RAIL_H = 0.9;
  for (const [grp, dir] of [[L.up, 1], [L.down, -1]]) {
    const z = 3.4 + dir * 0.07;              // 各階段の内側の端
    const railY = x => y0 + RAIL_H + dir * (SX - x) / (SX - FAR) * HALF;
    // 上の手すり（丸パイプ）
    const rail = cyl(0.022, sl.len + 0.04, railMat2, (SX + FAR) / 2, y0 + RAIL_H + dir * HALF / 2, z);
    rail.rotation.z = Math.PI / 2 - dir * sl.ang;
    grp.add(rail);
    // 両端の親柱
    grp.add(cyl(0.025, RAIL_H, railMat2, SX, y0 + RAIL_H / 2, z));
    grp.add(cyl(0.025, RAIL_H, railMat2, FAR, y0 + dir * HALF + RAIL_H / 2, z));
    // 段ごとの縦の筋（手すり子）
    for (let i = 0; i < STEPS; i++) {
      const x = SX - RUN * (i + 0.5);
      const bottom = y0 + dir * (i + 1) * RISE, top = railY(x);
      grp.add(cyl(0.008, top - bottom, railMat2, x, (top + bottom) / 2, z));
    }
  }
  // いちばん上の階: のぼりのかわりに床と天井 / いちばん下の階: くだりのかわりに床
  L.upCover = new THREE.Group();

// 扉1枚（幅0.6・高さ2.2）。縦長の窓つき。inner = 合わせ目側の向き（左扉なら +1）
function makeDoor(inner) {
  const g = new THREE.Group();
  const W = 0.6, H = 2.2, D = 0.04;
  const wx = inner * 0.04, ww = 0.3;      // 窓の中心x・幅（扉の半分。少し合わせ目寄り）

  const xl = wx - ww / 2, xr = wx + ww / 2;
  g.add(box(xl + W / 2, H, D, doorMat, (-W / 2 + xl) / 2, 0, 0));          // 窓の左側
  g.add(box(W / 2 - xr, H, D, doorMat, (xr + W / 2) / 2, 0, 0));           // 窓の右側
  g.add(box(ww, wy0 + H / 2, D, doorMat, wx, (-H / 2 + wy0) / 2, 0));     // 窓の下
  g.add(box(ww, H / 2 - wy1, D, doorMat, wx, (wy1 + H / 2) / 2, 0));      // 窓の上
  g.add(plane(ww, wy1 - wy0, glassMat, wx, (wy0 + wy1) / 2, 0));          // ガラス
  // 窓枠（表と裏）
  for (const z of [D / 2 + 0.002, -D / 2 - 0.002]) {
    g.add(box(ww + 0.02, 0.01, 0.004, seamMat, wx, wy0 - 0.005, z));
    g.add(box(ww + 0.02, 0.01, 0.004, seamMat, wx, wy1 + 0.005, z));
    g.add(box(0.01, wy1 - wy0, 0.004, seamMat, xl - 0.005, (wy0 + wy1) / 2, z));
    g.add(box(0.01, wy1 - wy0, 0.004, seamMat, xr + 0.005, (wy0 + wy1) / 2, z));
  }
  // 扉の合わせ目（閉まっているときに2枚の扉の切れ目が見えるように、内側の縁に濃い線を入れる）
  g.add(box(0.006, H, D + 0.004, seamMat, inner * (W / 2 - 0.003), 0, 0));
  g.position.set(-inner * 0.3, 1.1, -0.15);
  return g;
}

const FLOOR_HEIGHT = 3.2; // m（なかから見る昇降路の壁: テクスチャ1枚 = 1階ぶん）
// 昇降路の壁の絵。v（下=0, 上=1）と高さ y の関係: v = (y + 0.8) / FLOOR_HEIGHT（かごが階にぴったり止まったとき）
//   床 y=0 → v=0.25 / かごの窓 y=1.0..2.0 → v=0.5625..0.875
// withLights=true のときは、各階の乗り場の扉と、その窓からもれるホールの明かりも描く
function drawShaft(ctx, w, h, withLights) {
  const row = y => (1 - (y + 0.8) / FLOOR_HEIGHT) * h;   // 高さ y → canvas の行
  const col = x => (0.5 + x / 3) * w;                   // 横位置 x（壁の幅3m）→ canvas の列
  ctx.fillStyle = '#3a3d43'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {           // コンクリートのざらつき
    ctx.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '255,255,255'},${Math.random() * 0.06})`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 3, 3);
  }
  ctx.fillStyle = '#6b6f78'; ctx.fillRect(0, row(0), w, row(-0.3) - row(0));     // 各階の床スラブ
  ctx.fillStyle = '#25272c'; ctx.fillRect(0, row(-0.3), w, h * 0.01);
  ctx.fillStyle = '#ffcc33'; ctx.fillRect(0, row(0.05), w, row(0) - row(0.05));  // 黄色い目印
  if (!withLights) return;
  // 乗り場の扉（裏側）
  ctx.fillStyle = '#5d636c'; ctx.fillRect(col(-0.6), row(2.2), col(0.6) - col(-0.6), row(0) - row(2.2));
  // 扉の窓からもれるホールの明かり（かごの窓とぴったり重なる位置）
  ctx.save();
  ctx.shadowColor = '#ffe7a8'; ctx.shadowBlur = 24;
  ctx.fillStyle = '#fff4d8';
  for (const [x0, x1] of [[-0.43, -0.09], [0.09, 0.43]]) {
    ctx.fillRect(col(x0), row(2.02), col(x1) - col(x0), row(0.98) - row(2.02));
  }
  ctx.restore();
}

const tweens = new Set();
const easeInOut = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function tween(sec, fn, ease = easeInOut) {
  return new Promise(res => tweens.add({ t0: performance.now(), dur: sec * 1000, fn, ease, res }));
}
const wait = sec => tween(sec, () => {});
function updateTweens(now) {
  for (const t of [...tweens]) {
    const p = Math.min(1, (now - t.t0) / t.dur);
    t.fn(t.ease(p));
    if (p >= 1) { tweens.delete(t); t.res(); }
  }
}

const OUT_POS = { x: 0, y: 1.5, z: 3.4, yaw: 0, pitch: -0.03 };
const STAIRS_POS = { x: -5.0, y: 1.5, z: 3.4, yaw: Math.PI / 2, pitch: -0.2 };
const rig = { ...OUT_POS };

// 半階ぶんの階段を歩く（足音つき）
function walkFlight(toX, dy, sec) {
  const fx = rig.x, fy = rig.y, ty = rig.y + dy;
  let last = -1;
  return tween(sec, p => {
    rig.x = fx + (toX - fx) * p;
    rig.y = fy + (ty - fy) * p + Math.abs(Math.sin(p * STEPS * Math.PI)) * 0.035;
    const step = Math.floor(p * STEPS);
    if (step !== last && step < STEPS) { last = step; tone(dy > 0 ? 220 : 180, 0.06, 0, 'triangle', 0.06); }
  }, p => p);
}
function moveCam(to, sec) {
  const from = { ...rig };
  return tween(sec, p => { for (const k in to) rig[k] = from[k] + (to[k] - from[k]) * p; });
}

// 扉は途中の位置からでも動かせる（かかる時間は残りの距離に比例）
const openDoors = async () => {
  const s = S.door;
  if (s < 1) await tween(CONFIG.doorSeconds * Math.max(1 - s, 0.2), p => { S.door = s + (1 - s) * p; });
  S.door = 1;
};
// 閉まりきったら true、途中で「開」が押されたら false を返す
let closingJob = null;
function closeDoors() {
  return new Promise(res => {
    const s = S.door;
    const job = {
      t0: performance.now(), dur: CONFIG.doorSeconds * 1000 * Math.max(s, 0.2), ease: easeInOut,
      fn: p => { S.door = s * (1 - p); },
      res: () => { closingJob = null; S.door = 0; res(true); },
      cancel: () => { tweens.delete(job); closingJob = null; res(false); },
    };
    closingJob = job;
    tweens.add(job);
  });
}

async function moveCar(target) {
  if (target === S.carFloor) return;
  S.moving = true;
  S.moveDir = Math.sign(target - S.carFloor);
  refresh3D(); renderUI();
  await wait(0.3);
  const start = S.carFloor;
  // かごの位置(carPos)を少しずつ動かす。動き出しはゆっくり加速、最後の1階はゆっくり減速
  while (S.carFloor !== target) {
    const from = S.carFloor, to = from + S.moveDir;
    const first = from === start, last = to === target;
    const ease = first && last ? easeInOut : first ? (p => p * p) : last ? (p => 1 - (1 - p) * (1 - p)) : (p => p);
    await tween(CONFIG.secondsPerFloor * (first || last ? 1.4 : 1), p => { S.carPos = from + (to - from) * p; }, ease);
    S.carFloor = to;
    S.carPos = to;
    if (S.inside) applyHall();
    refresh3D(); renderUI();
  }
  await wait(0.3);
  S.moving = false;
  S.moveDir = 0;
  refresh3D();
}

// ---------- 音 ----------
let actx = null;
function tone(freq, dur, when = 0, type = 'sine', vol = 0.2) {
  try {
    actx ??= new AudioContext();
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch { /* 音が出せない環境では無視 */ }
}
const beep = () => tone(1046, 0.12, 0, 'triangle', 0.12);
const chime = () => { tone(784, 1.0, 0, 'sine', 0.25); tone(659, 1.3, 0.45, 'sine', 0.25); };

// 状態遷移
// ============================================================
function available() {
  const calls = () => [
    ...(S.playerFloor < TOP ? ['call:up'] : []),
    ...(S.playerFloor > 0 ? ['call:down'] : []),
  ];
  const floors = () => FLOORS.map((_, i) => i).filter(i => i !== S.carFloor).map(i => `floor:${i}`); // B1F → R の順
  switch (S.phase) {
    case 'OUT_IDLE': return ['go_stairs', ...calls()];
    case 'OUT_WAITING':
    case 'OUT_CLOSING': return calls();
    case 'STAIRS_IDLE': return [
      ...(S.playerFloor < TOP ? ['climb:up'] : []),
      ...(S.playerFloor > 0 ? ['climb:down'] : []),
      'go_hall',
    ];
    case 'OUT_ARRIVED': return ['board', 'skip'];
    case 'IN_STOPPED': return [...floors(), 'close', 'alight'];
    case 'IN_CLOSED': return [...floors(), 'open', 'alight'];
    case 'IN_ARRIVED': return [...floors(), 'close', 'alight', 'stay'];
    case 'IN_CLOSING': return ['open'];
    default: return [];
  }
}
const isEnabled = a => available().includes(a);
function setPhase(p) { S.phase = p; refresh3D(); renderUI(); }

// なかで扉を閉める。閉まりきったら true、「開」で中断されたら false
async function closeInside() {
  setPhase('IN_CLOSING');
  return closeDoors();
}
async function reopenInside() {
  S.doorBtnLit = 'open';
  setPhase('BUSY');
  await openDoors();
  S.doorBtnLit = null;
}

async function doAction(a) {
  if (!isEnabled(a)) return;
  beep();
  const [kind, arg] = a.split(':');

  if (kind === 'call') {
    S.callLit[arg] = true;
    refresh3D(); renderUI();
    if (S.phase === 'OUT_CLOSING') { closingJob?.cancel(); return; } // 開け直しは alight 側が行う
    if (S.phase !== 'OUT_IDLE') return; // すでに呼んでいる（移動中）
    if (S.carFloor === S.playerFloor) {
      setPhase('BUSY');
    } else {
      setPhase('OUT_WAITING');
      await moveCar(S.playerFloor);
      chime();
    }
    await openDoors();
    S.callLit.up = S.callLit.down = false;
    setPhase('OUT_ARRIVED');
  }

  else if (kind === 'go_stairs') {
    setPhase('WALKING');
    await moveCam({ yaw: Math.PI / 2, pitch: 0 }, 0.6);
    await moveCam({ x: STAIRS_POS.x, z: STAIRS_POS.z }, 1.6);
    await moveCam({ pitch: STAIRS_POS.pitch }, 0.3);
    S.onStairs = true;
    setPhase('STAIRS_IDLE');
  }

  else if (kind === 'go_hall') {
    setPhase('WALKING');
    S.onStairs = false;
    await moveCam({ yaw: -Math.PI / 2, pitch: 0 }, 0.8);
    await moveCam({ x: OUT_POS.x, z: OUT_POS.z }, 1.6);
    await moveCam({ yaw: 0, pitch: OUT_POS.pitch }, 0.5);
    setPhase('OUT_IDLE');
  }

  else if (kind === 'climb') {
    // 1階ぶん = 入口へ0.5秒 + 半階2.6秒 + 折り返し1.4秒 + 半階2.6秒 + 入口の前へ0.9秒 = 8秒
    const dir = arg === 'up' ? 1 : -1;
    S.climbDir = dir;
    setPhase('CLIMBING');
    const z1 = dir > 0 ? LEFT_Z : RIGHT_Z, z2 = dir > 0 ? RIGHT_Z : LEFT_Z;
    const pitch = dir > 0 ? 0.12 : -0.35;
    await moveCam({ x: SX + 0.3, z: z1, pitch }, 0.5);
    await walkFlight(FAR - 0.3, dir * HALF, 2.6);
    // 奥の踊り場（ホールが見えない向き）で「いまの階」を切り替えて、ひとつ下/上の階の踊り場にいることにする
    rig.y -= dir * FLOOR_H;
    S.playerFloor += dir;
    applyHall();
    // 折り返し（のぼりは右回り、くだりは左回り）
    const x0 = rig.x, z0 = rig.z, yaw0 = rig.yaw, yaw1 = dir > 0 ? -Math.PI / 2 : Math.PI * 1.5;
    await tween(1.4, p => {
      rig.x = x0 - Math.sin(p * Math.PI) * 0.35;
      rig.z = z0 + (z2 - z0) * p;
      rig.yaw = yaw0 + (yaw1 - yaw0) * p;
    });
    await walkFlight(SX + 0.3, dir * HALF, 2.6);
    if (rig.yaw > Math.PI) rig.yaw -= Math.PI * 2;
    await moveCam({ x: STAIRS_POS.x, z: STAIRS_POS.z, yaw: STAIRS_POS.yaw, pitch: STAIRS_POS.pitch }, 0.9);
    S.climbDir = 0;
    setPhase('STAIRS_IDLE');
  }

  else if (kind === 'board') {
    setPhase('BOARDING');
    await moveCam({ x: 0, z: -1.25, yaw: 0, pitch: -0.05 }, 1.6);
    S.inside = true;
    await moveCam({ x: 0.25, z: -1.88, yaw: Math.PI - 0.4, pitch: 0.06 }, 1.2);
    setPhase('IN_STOPPED');
  }

  else if (kind === 'floor') {
    S.target = Number(arg);
    // 閉まる途中で「開」が押されたら、開け直してから少し待って、もう一度閉める
    while (!(await closeInside())) {
      await reopenInside();
      setPhase('BUSY');
      await wait(1.5);
    }
    setPhase('IN_MOVING');
    await moveCar(S.target);
    chime();
    await openDoors();
    S.target = null;
    setPhase('IN_ARRIVED');
  }

  else if (kind === 'open' && S.phase === 'IN_CLOSING') {
    closingJob?.cancel(); // 開け直しは closeInside を呼んだ側が行う
  }

  else if (kind === 'open') {
    S.doorBtnLit = 'open';
    setPhase('BUSY');
    await openDoors();
    S.doorBtnLit = null;
    setPhase('IN_STOPPED');
  }

  else if (kind === 'close' || kind === 'stay') {
    if (kind === 'close') S.doorBtnLit = 'close';
    if (await closeInside()) {
      S.doorBtnLit = null;
      setPhase('IN_CLOSED');
    } else {
      await reopenInside();
      setPhase('IN_STOPPED');
    }
  }

  else if (kind === 'alight') {
    setPhase('ALIGHTING');
    if (S.door < 1) await openDoors();
    await moveCam({ x: 0, z: -1.3, yaw: Math.PI, pitch: -0.05 }, 0.7);
    await moveCam({ z: 2.3 }, 1.5);
    S.inside = false;
    S.playerFloor = S.carFloor;
    applyHall();
    await moveCam({ z: OUT_POS.z, yaw: Math.PI * 2, pitch: OUT_POS.pitch }, 1.1);
    rig.yaw = 0;
    await wait(0.6);
    await closeOutside();
  }

  else if (kind === 'skip') {
    // のらない: そのまま扉が閉まる（閉まる途中に うえ/した で開け直せる）
    await closeOutside();
  }
}

// そとから見て扉を閉める。閉まる途中で うえ/した が押されたら開け直す（何度でも）
async function closeOutside() {
  setPhase('OUT_CLOSING');
  if (await closeDoors()) {
    setPhase('OUT_IDLE');
  } else {
    setPhase('BUSY');
    await openDoors();
    S.callLit.up = S.callLit.down = false;
    setPhase('OUT_ARRIVED');
  }
}

// ============================================================
// 画面下のボタン表示エリア
// ============================================================
const controls = document.getElementById('controls');
const whereEl = document.getElementById('where');
const statusEl = document.getElementById('status');

const STATUS = {
  OUT_IDLE: () => S.carFloor === S.playerFloor
    ? 'エレベーターは ここに いるよ。ボタンを おしてね'
    : 'うえ か した の ボタンで エレベーターを よぼう！',
  OUT_CLOSING: () => 'とびらが しまるよ（うえ・した で あけなおせるよ）',
  OUT_WAITING: () => 'エレベーターが くるのを まってね…',
  OUT_ARRIVED: () => 'エレベーターが きたよ！ のってみよう',
  BOARDING: () => 'エレベーターに のるよ',
  IN_STOPPED: () => 'いきたい かいの ボタンを おしてね',
  IN_CLOSED: () => 'いきたい かいの ボタンを おしてね',
  IN_MOVING: () => `${FLOORS[S.target]} に むかって うごいているよ…`,
  IN_ARRIVED: () => `${FLOORS[S.carFloor]}（${kana(FLOORS[S.carFloor])}）に ついたよ！`,
  ALIGHTING: () => 'エレベーターから おりるよ',
  IN_CLOSING: () => (S.target !== null ? `${FLOORS[S.target]} に いくよ。` : '') + 'とびらが しまるよ（「ひらく」で あけなおせるよ）',
  STAIRS_IDLE: () => S.playerFloor === TOP ? 'ここが いちばん うえ だよ。かいだんを おりられるよ'
    : S.playerFloor === 0 ? 'ここが いちばん した だよ。かいだんを のぼれるよ'
    : 'かいだんを のぼる？ おりる？',
  CLIMBING: () => `かいだんを ${S.climbDir > 0 ? 'のぼって' : 'おりて'} いるよ…`,
  WALKING: () => 'あるいて いるよ…',
  BUSY: () => 'ちょっと まってね',
};

function renderUI() {
  whereEl.textContent = `いま：${FLOORS[hallFloor()]}・${S.inside ? 'エレベーターのなか' : S.onStairs ? 'かいだん' : 'エレベーターのそと'}`;
  statusEl.textContent = STATUS[S.phase]();

  controls.innerHTML = '';
  const acts = available();
  if (!acts.length) {
    const p = document.createElement('div');
    p.className = 'waiting';
    p.textContent = '（いまは おせる ボタンは ないよ）';
    const c = document.createElement('div'); c.className = 'center'; c.append(p);
    controls.append(document.createElement('div'), c, document.createElement('div'));
    return;
  }
  const left = document.createElement('div'), right = document.createElement('div');
  const center = document.createElement('div'); center.className = 'center';
  const btnGroup = document.createElement('div'); btnGroup.className = 'group';
  const doorGroup = document.createElement('div'); doorGroup.className = 'group';
  const actGroup = document.createElement('div'); actGroup.className = 'group';
  for (const a of acts) {
    const [kind, arg] = a.split(':');
    const b = document.createElement('button');
    b.className = 'b';
    if (kind === 'call') {
      b.classList.add('call');
      if (S.callLit[arg]) b.classList.add('lit');
      b.innerHTML = arg === 'up' ? '<span class="arrow">▲</span>うえ' : '<span class="arrow">▼</span>した';
      btnGroup.append(b);
    } else if (kind === 'open' || kind === 'close') {
      b.classList.add('door');
      b.innerHTML = kind === 'open' ? '<span class="arrow">◀▶</span>ひらく' : '<span class="arrow">▶◀</span>とじる';
      doorGroup.append(b);
    } else if (kind === 'go_stairs') {
      b.classList.add('nav');
      b.textContent = '◀ かいだんにいく';
      left.append(b);
    } else if (kind === 'go_hall') {
      b.classList.add('nav');
      b.textContent = 'エレベーターのまえにいく ▶';
      right.append(b);
    } else if (kind === 'climb') {
      b.classList.add('stairs');
      const to = FLOORS[S.playerFloor + (arg === 'up' ? 1 : -1)];
      b.innerHTML = arg === 'up' ? `<span class="arrow">▲ のぼる</span>${to}へ` : `<span class="arrow">▼ おりる</span>${to}へ`;
      btnGroup.append(b);
    } else if (kind === 'floor') {
      b.classList.add('floor');
      b.textContent = FLOORS[Number(arg)];
      btnGroup.append(b);
    } else {
      b.classList.add('action', kind);
      b.textContent = { board: 'エレベーターにのる', skip: 'エレベーターにのらない', alight: 'エレベーターからおりる', stay: 'エレベーターからおりない' }[kind];
      actGroup.append(b);
    }
    b.addEventListener('click', () => doAction(a));
  }
  center.append(...[doorGroup, btnGroup, actGroup].filter(g => g.children.length));
  controls.append(left, center, right);
}

// ============================================================
// 3D 上のボタンをクリック
// ============================================================
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const zone = S.inside ? 'in' : 'out';
  const targets = clickables.filter(m => m.visible && m.userData.zone === zone);
  const hit = raycaster.intersectObjects(targets, false)[0];
  return hit ? hit.object.userData.action : null;
}
renderer.domElement.addEventListener('pointerdown', ev => { const a = pick(ev); if (a) doAction(a); });
renderer.domElement.addEventListener('pointermove', ev => {
  const a = pick(ev);
  renderer.domElement.style.cursor = a && isEnabled(a) ? 'pointer' : 'default';
});

// ============================================================
// ループ
// ============================================================
function loop(now) {
  requestAnimationFrame(loop);
  updateTweens(now);
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  // そとから見ると、かごは昇降路の中を実際に上下する（近づくと扉の窓から見えてくる）
  const carOffset = S.carPos - S.playerFloor;
  car.position.y = S.inside ? 0 : carOffset * SHAFT_FLOOR_H;
  car.visible = S.inside || Math.abs(carOffset) < 1;
  // 移動中のなか: ホールの代わりに昇降路の壁を見せて、窓の景色を流す
  const inShaft = S.inside && S.moving;
  hall.visible = !inShaft;
  shaftIn.visible = inShaft;
  shaftOut.visible = !S.inside;
  // なかから見る昇降路の壁は、かごが動いたぶんだけ流す（テクスチャ1枚 = 1階）
  shaftTex.tex.offset.y = S.carPos; // 階にぴったりのとき、各階の明かりがかごの窓に重なる
  stairLight.position.set(-6.6, rig.y + 1.4, 3.4);
  // 踊り場の表示は、階の床からだと階段や手すりに半分かくれて見えてしまうので、上り下りしている間だけ表示
  for (const L of levels) L.signMesh.visible = S.phase === 'CLIMBING';
  doorL.position.x = -0.3 - 0.6 * S.door;
  doorR.position.x = 0.3 + 0.6 * S.door;
  camera.position.set(rig.x, rig.y, rig.z);
  if (S.inside && S.moving) camera.position.y += Math.sin(now * 0.045) * 0.0018 + (Math.random() - 0.5) * 0.0012;
  camera.rotation.set(rig.pitch, rig.yaw, 0);
  renderer.render(scene, camera);
}

// デバッグ・確認用
window.__elevator = { S, doAction, available, rig };

resize();
applyHall();
refresh3D();
renderUI();
requestAnimationFrame(loop);
</script>
